


<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080604">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="VARJÃO AI">
  <meta name="description" content="VARJÃO AI — Assistente pessoal inteligente.">

  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="stylesheet" href="/style.css">

  <title>VARJÃO AI</title>

  <style>
    /* Elementos internos mantidos para compatibilidade com o app.js */
    .internal-state {
      display: none !important;
    }

    .topbar .brand-mark small {
      display: none;
    }

    .topbar .status {
      gap: 0;
    }

    .topbar .status-light {
      width: 9px;
      height: 9px;
      flex: 0 0 9px;
    }

    .hero {
      grid-template-columns: minmax(0, 1fr);
      justify-items: center;
      padding-top: 30px;
      padding-bottom: 20px;
    }

    .hero-copy {
      display: none !important;
    }

    .presence-panel {
      margin-top: 0;
    }

    footer {
      display: none;
    }
  </style>
</head>

<body>
  <div class="app-shell">

    <!-- CABEÇALHO -->
    <header class="topbar">

      <a class="brand-mark" href="/" aria-label="VARJÃO AI início">
        <span class="crown">♛</span>
        <span>
          <strong>VARJÃO</strong>
          <small>PERSONAL AI</small>
        </span>
      </a>

      <div class="status" id="systemStatus" aria-label="Online">
        <span class="status-light"></span>
        <span id="statusText" class="internal-state">ONLINE</span>
      </div>

    </header>

    <main>

      <!-- AVATAR -->
      <section class="hero" id="heroSection">

        <div class="hero-photo-wrap" id="presenceCore">

          <div class="hero-orbit"></div>

          <div class="presence-ring presence-ring-one"></div>
          <div class="presence-ring presence-ring-two"></div>

          <div class="presence-particles"></div>

          <img
            class="hero-photo"
            src="/avatar.jpg"
            alt="Avatar do VARJÃO"
          >

          <div class="presence-indicator" id="presenceIndicator">
            <span></span>
          </div>

        </div>

        <!-- Elementos internos preservados para o app.js -->
        <div class="hero-copy internal-state">

          <div class="eyebrow">
            <span class="eyebrow-dot"></span>
            INTELIGÊNCIA ARTIFICIAL PESSOAL
          </div>

          <h1 id="heroGreeting">VARJÃO</h1>

          <p id="heroDescription">Online.</p>

          <div class="signature">
            VARJÃO <span>AI</span>
          </div>

          <div class="personality-status" id="personalityStatus">
            <span class="personality-dot"></span>
            <span id="personalityText">ONLINE</span>
          </div>

        </div>

      </section>

      <!-- ESTADO DE INTERAÇÃO -->
      <section class="presence-panel" id="presencePanel">

        <div class="presence-label">
          <span class="presence-label-icon">◉</span>
          <span id="listenState">AGUARDANDO COMANDO</span>
        </div>

        <div class="voice-visualizer" id="voiceVisualizer">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>

        <div class="presence-caption internal-state" id="presenceCaption">
          Online.
        </div>

      </section>

      <!-- CONVERSA -->
      <section class="chat-panel">

        <div class="chat-head">

          <div class="chat-title">
            <span class="chat-title-indicator"></span>
            <span>CONVERSA</span>
          </div>

          <button id="clearBtn" class="text-btn" type="button">
            LIMPAR
          </button>

        </div>

        <div
          id="messages"
          class="messages"
          aria-live="polite"
          aria-relevant="additions text"
        >

          <div class="message assistant">

            <img
              class="message-avatar"
              src="/avatar.jpg"
              alt=""
            >

            <div class="message-body">
              <span class="speaker">VARJÃO</span>
              <p>Olá! Estou pronto. Como posso ajudar?</p>
            </div>

          </div>

        </div>

        <!-- CAMPO DE MENSAGEM -->
        <form id="chatForm" class="composer">

          <input
            id="prompt"
            type="text"
            autocomplete="off"
            placeholder="Fale comigo ou digite..."
            aria-label="Mensagem"
          >

          <button
            class="send-btn"
            type="submit"
            aria-label="Enviar"
          >
            ➤
          </button>

        </form>

        <!-- CONTROLES -->
        <div class="controls">

          <button id="micBtn" class="mic-btn" type="button">
            <span class="mic-symbol">🎙</span>
            FALAR
          </button>

          <label
            for="imageInput"
            class="add-btn"
            aria-label="Adicionar foto"
          >
            +
          </label>

          <input
            id="imageInput"
            type="file"
            accept="image/*"
            hidden
          >

        </div>

        <p class="privacy-note">
          Sua chave de IA fica no servidor, nunca neste iPhone.
        </p>

      </section>

    </main>

  </div>

  <script src="/app.js"></script>

</body>
</html>
