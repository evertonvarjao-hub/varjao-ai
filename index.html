
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080604">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="VARJÃO AI">
  <meta name="description" content="VARJÃO AI — Assistente pessoal inteligente.">

  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="stylesheet" href="/style.css">

  <title>VARJÃO AI</title>

  <style>
    .internal-state {
      display: none !important;
    }

    .topbar .brand-mark small {
      display: none;
    }

    .topbar .status {
      gap: 0;
    }

    .topbar .status-light {
      width: 9px;
      height: 9px;
      flex: 0 0 9px;
    }

    .hero {
      grid-template-columns: minmax(0, 1fr);
      justify-items: center;
      padding-top: 30px;
      padding-bottom: 20px;
    }

    .hero-copy {
      display: none !important;
    }

    .presence-panel {
      margin-top: 0;
    }

    footer {
      display: none;
    }

    .document-panel {
      display: none;
      margin: 14px 0;
      padding: 14px;
      border: 1px solid rgba(217, 173, 85, .45);
      border-radius: 12px;
      background: rgba(20, 16, 10, .96);
      color: #f5e8cb;
      text-align: left;
    }

  .document-panel {
  display: none;
}

.document-panel.active {
  display: block;
}
    }

    .document-heading {
      font-weight: 700;
      margin-bottom: 10px;
      color: #e8c477;
    }

    .document-filename {
      font-size: 13px;
      opacity: .85;
      overflow-wrap: anywhere;
      margin-bottom: 10px;
    }

    .document-panel textarea {
      display: block;
      width: 100%;
      box-sizing: border-box;
      border: 1px solid rgba(217, 173, 85, .35);
      border-radius: 8px;
      background: #090806;
      color: #fff;
      padding: 11px;
      font: inherit;
      font-size: 14px;
      resize: vertical;
      margin: 8px 0;
    }

    #documentContent {
      min-height: 150px;
    }

    #documentInstruction {
      min-height: 75px;
    }

    .document-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .document-actions button {
      flex: 1 1 130px;
      min-height: 42px;
      border: 1px solid rgba(217, 173, 85, .55);
      border-radius: 8px;
      background: #211a0e;
      color: #f5d58d;
      font-weight: 700;
      padding: 9px;
    }

    .document-actions button:disabled {
      opacity: .5;
    }

    .document-status {
      font-size: 12px;
      margin-top: 10px;
      color: #e8c477;
      min-height: 18px;
    }

    .document-close {
      float: right;
      border: 0;
      background: transparent;
      color: #e8c477;
      font-size: 20px;
    }

    .document-button {
      cursor: pointer;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    #historyBtn {
      border: 1px solid rgba(217, 173, 85, .45);
      background: rgba(217, 173, 85, .08);
      color: #f1d28e;
      border-radius: 9px;
      padding: 9px 12px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .5px;
      white-space: nowrap;
      cursor: pointer;
    }

    #historyOverlay {
      position: fixed;
      inset: 0;
      z-index: 9998;
      background: rgba(0, 0, 0, .68);
      opacity: 0;
      visibility: hidden;
      transition: opacity .22s ease, visibility .22s ease;
    }

    #historyOverlay.active {
      opacity: 1;
      visibility: visible;
    }

    #historyDrawer {
      position: absolute;
      top: 0;
      right: 0;
      width: min(88%, 360px);
      height: 100%;
      height: 100dvh;
      box-sizing: border-box;
      padding: max(22px, env(safe-area-inset-top)) 18px max(22px, env(safe-area-inset-bottom));
      background: #100d08;
      border-left: 1px solid rgba(217, 173, 85, .35);
      transform: translateX(100%);
      transition: transform .24s ease;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #historyOverlay.active #historyDrawer {
      transform: translateX(0);
    }

    .history-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 18px;
      border-bottom: 1px solid rgba(217, 173, 85, .2);
    }

    .history-heading {
      color: #f1d28e;
      font-weight: 800;
      letter-spacing: 1px;
      font-size: 15px;
    }

    #historyClose {
      border: 0;
      background: transparent;
      color: #f1d28e;
      font-size: 28px;
      padding: 0 6px;
      cursor: pointer;
    }

    #newConversationBtn {
      width: 100%;
      margin: 16px 0;
      min-height: 46px;
      border: 1px solid rgba(217, 173, 85, .55);
      border-radius: 10px;
      background: rgba(217, 173, 85, .12);
      color: #f1d28e;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }

    #historyList {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-bottom: 20px;
    }

    .history-item {
      width: 100%;
      text-align: left;
      border: 1px solid rgba(217, 173, 85, .18);
      border-radius: 9px;
      padding: 12px;
      background: rgba(255, 255, 255, .035);
      color: #f5e8cb;
      cursor: pointer;
    }

    .history-item.active {
      border-color: rgba(217, 173, 85, .7);
      background: rgba(217, 173, 85, .12);
    }

    .history-item strong {
      display: block;
      font-size: 13px;
      line-height: 1.4;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .history-item small {
      display: block;
      margin-top: 5px;
      color: #b9a987;
      font-size: 11px;
    }

    .history-empty {
      color: #b9a987;
      font-size: 13px;
      text-align: center;
      padding: 24px 10px;
      line-height: 1.6;
    }

    body.history-open {
      overflow: hidden;
    }
  </style>
</head>

<body>
  <div class="app-shell">

    <header class="topbar">
      <a class="brand-mark" href="/" aria-label="VARJÃO AI início">
        <span class="hero-photo-wrap" id="presenceCore">
          <img class="hero-photo" src="/avatar.jpg" alt="Avatar do VARJÃO">
          <span class="presence-indicator" id="presenceIndicator"><span></span></span>
        </span>
        <span class="crown">♛</span>
        <span class="brand-name">
          <strong>VARJÃO</strong>
          <small>AI</small>
        </span>
      </a>

      <div class="topbar-actions">
        <div class="status" id="systemStatus" aria-label="Online">
          <span class="status-light"></span>
          <span id="statusText" class="internal-state">ONLINE</span>
        </div>

        <button id="historyBtn" type="button">
          ☰ HISTÓRICO
        </button>
      </div>
    </header>

    <main>

      <section class="hero" id="heroSection">
        <!-- A foto e o indicador de presença agora ficam no cabeçalho compacto. -->

        <div class="hero-copy internal-state">
          <div class="eyebrow">
            <span class="eyebrow-dot"></span>
            INTELIGÊNCIA ARTIFICIAL PESSOAL
          </div>
          <h1 id="heroGreeting">VARJÃO</h1>
          <p id="heroDescription">Online.</p>
          <div class="signature">VARJÃO <span>AI</span></div>
          <div class="personality-status" id="personalityStatus">
            <span class="personality-dot"></span>
            <span id="personalityText">ONLINE</span>
          </div>
        </div>
      </section>

      <section class="presence-panel" id="presencePanel">
        <div class="presence-label">
          <span class="presence-label-icon">◉</span>
          <span id="listenState">AGUARDANDO COMANDO</span>
        </div>

        <div class="voice-visualizer" id="voiceVisualizer">
          <span></span><span></span><span></span>
          <span></span><span></span><span></span>
          <span></span><span></span><span></span>
          <span></span><span></span>
        </div>

        <div class="presence-caption internal-state" id="presenceCaption">
          Online.
        </div>
      </section>

      <section class="chat-panel">

        <div class="chat-head">
          <div class="chat-title">
            <span class="chat-title-indicator"></span>
            <span>CONVERSA</span>
          </div>

          <button id="clearBtn" class="text-btn" type="button">
            LIMPAR
          </button>
        </div>

        <div
          id="messages"
          class="messages"
          aria-live="polite"
          aria-relevant="additions text"
        >
          <div class="message assistant">
            <img class="message-avatar" src="/avatar.jpg" alt="">
            <div class="message-body">
              <span class="speaker">VARJÃO</span>
              <p>Olá! Estou pronto. Como posso ajudar?</p>
            </div>
          </div>
        </div>

        <form id="chatForm" class="composer">
          <input
            id="prompt"
            type="text"
            autocomplete="off"
            placeholder="Fale comigo ou digite..."
            aria-label="Mensagem"
          >

          <button class="send-btn" type="submit" aria-label="Enviar">
            ➤
          </button>
        </form>

        <div class="controls">

          <button id="micBtn" class="mic-btn" type="button">
            <span class="mic-symbol">🎙</span>
            FALAR
          </button>

          <label for="imageInput" class="add-btn" aria-label="Adicionar foto">
            +
          </label>

          <input
            id="imageInput"
            type="file"
            accept="image/*,.pdf,.docx,.txt,.xlsx,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
            hidden
          >

          <button
            id="documentBtn"
            class="add-btn document-button"
            type="button"
            aria-label="Adicionar documento"
            title="Adicionar documento"
          >
            📄
          </button>

          <input
            id="documentInput"
            type="file"
            accept=".pdf,.docx,.txt,.xlsx"
            hidden
          >
        </div>

        <section id="documentPanel" class="document-panel">
          <button
            id="documentClose"
            class="document-close"
            type="button"
            aria-label="Fechar documentos"
          >
            ×
          </button>

          <div class="document-heading">
            DOCUMENTO DO VARJÃO
          </div>

          <div id="documentFilename" class="document-filename">
            Nenhum documento selecionado.
          </div>

          <label for="documentContent">Conteúdo do documento</label>
          <textarea
            id="documentContent"
            placeholder="O conteúdo extraído aparecerá aqui..."
          ></textarea>

          <label for="documentInstruction">O que deseja que o VARJÃO faça?</label>
          <textarea
            id="documentInstruction"
            placeholder="Ex.: Corrija os erros, melhore a escrita e preserve todas as informações."
          ></textarea>

          <div class="document-actions">
            <button id="documentEdit" type="button">
              ✨ APLICAR EDIÇÃO
            </button>

            <button id="documentExport" type="button">
              ↓ GERAR PDF
            </button>
          </div>

          <div
            id="documentStatus"
            class="document-status"
            aria-live="polite"
          ></div>
        </section>

        <p class="privacy-note">
          Sua chave de IA fica no servidor, nunca neste iPhone.
        </p>

      </section>

    </main>
  </div>

  <div id="historyOverlay" aria-hidden="true">
    <aside id="historyDrawer" aria-label="Histórico de conversas">
      <div class="history-header">
        <div class="history-heading">SUAS CONVERSAS</div>
        <button id="historyClose" type="button" aria-label="Fechar histórico">×</button>
      </div>

      <button id="newConversationBtn" type="button">
        + NOVA CONVERSA
      </button>

      <div id="historyList"></div>
    </aside>
  </div>

  <script src="/app.js"></script>
  <script src="/history.js"></script>
  <script src="/documents.js"></script>

</body>
</html>
