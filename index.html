
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080604">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="VARJÃO AI">
  <meta name="description" content="VARJÃO AI — Assistente pessoal inteligente.">

  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="stylesheet" href="/style.css">

  <title>VARJÃO AI</title>

  <style>
    .internal-state {
      display: none !important;
    }

    .topbar .brand-mark small {
      display: none;
    }

    .topbar .status {
      gap: 0;
    }

    .topbar .status-light {
      width: 9px;
      height: 9px;
      flex: 0 0 9px;
    }

    .hero {
      grid-template-columns: minmax(0, 1fr);
      justify-items: center;
      padding-top: 30px;
      padding-bottom: 20px;
    }

    .hero-copy {
      display: none !important;
    }

    .presence-panel {
      margin-top: 0;
    }

    footer {
      display: none;
    }

    /* ÁREA DE DOCUMENTOS */
    .document-panel {
      display: none;
      margin: 14px 0;
      padding: 14px;
      border: 1px solid rgba(217, 173, 85, .45);
      border-radius: 12px;
      background: rgba(20, 16, 10, .96);
      color: #f5e8cb;
      text-align: left;
    }

    /* Edição automática pela conversa */
#documentPanel {
  display: none !important;
}
    }

    .document-heading {
      font-weight: 700;
      margin-bottom: 10px;
      color: #e8c477;
    }

    .document-filename {
      font-size: 13px;
      opacity: .85;
      overflow-wrap: anywhere;
      margin-bottom: 10px;
    }

    .document-panel textarea {
      display: block;
      width: 100%;
      box-sizing: border-box;
      border: 1px solid rgba(217, 173, 85, .35);
      border-radius: 8px;
      background: #090806;
      color: #fff;
      padding: 11px;
      font: inherit;
      font-size: 14px;
      resize: vertical;
      margin: 8px 0;
    }

    #documentContent {
      min-height: 150px;
    }

    #documentInstruction {
      min-height: 75px;
    }

    .document-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .document-actions button {
      flex: 1 1 130px;
      min-height: 42px;
      border: 1px solid rgba(217, 173, 85, .55);
      border-radius: 8px;
      background: #211a0e;
      color: #f5d58d;
      font-weight: 700;
      padding: 9px;
    }

    .document-actions button:disabled {
      opacity: .5;
    }

    .document-status {
      font-size: 12px;
      margin-top: 10px;
      color: #e8c477;
      min-height: 18px;
    }

    .document-close {
      float: right;
      border: 0;
      background: transparent;
      color: #e8c477;
      font-size: 20px;
    }

    .document-button {
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div class="app-shell">

    <header class="topbar">
      <a class="brand-mark" href="/" aria-label="VARJÃO AI início">
        <span class="crown">♛</span>
        <span>
          <strong>VARJÃO</strong>
          <small>PERSONAL AI</small>
        </span>
      </a>

      <div class="status" id="systemStatus" aria-label="Online">
        <span class="status-light"></span>
        <span id="statusText" class="internal-state">ONLINE</span>
      </div>
    </header>

    <main>

      <section class="hero" id="heroSection">
        <div class="hero-photo-wrap" id="presenceCore">
          <div class="hero-orbit"></div>
          <div class="presence-ring presence-ring-one"></div>
          <div class="presence-ring presence-ring-two"></div>
          <div class="presence-particles"></div>

          <img
            class="hero-photo"
            src="/avatar.jpg"
            alt="Avatar do VARJÃO"
          >

          <div class="presence-indicator" id="presenceIndicator">
            <span></span>
          </div>
        </div>

        <div class="hero-copy internal-state">
          <div class="eyebrow">
            <span class="eyebrow-dot"></span>
            INTELIGÊNCIA ARTIFICIAL PESSOAL
          </div>
          <h1 id="heroGreeting">VARJÃO</h1>
          <p id="heroDescription">Online.</p>
          <div class="signature">VARJÃO <span>AI</span></div>
          <div class="personality-status" id="personalityStatus">
            <span class="personality-dot"></span>
            <span id="personalityText">ONLINE</span>
          </div>
        </div>
      </section>

      <section class="presence-panel" id="presencePanel">
        <div class="presence-label">
          <span class="presence-label-icon">◉</span>
          <span id="listenState">AGUARDANDO COMANDO</span>
        </div>

        <div class="voice-visualizer" id="voiceVisualizer">
          <span></span><span></span><span></span>
          <span></span><span></span><span></span>
          <span></span><span></span><span></span>
          <span></span><span></span>
        </div>

        <div class="presence-caption internal-state" id="presenceCaption">
          Online.
        </div>
      </section>

      <section class="chat-panel">

        <div class="chat-head">
          <div class="chat-title">
            <span class="chat-title-indicator"></span>
            <span>CONVERSA</span>
          </div>

          <button id="clearBtn" class="text-btn" type="button">
            LIMPAR
          </button>
        </div>

        <div
          id="messages"
          class="messages"
          aria-live="polite"
          aria-relevant="additions text"
        >
          <div class="message assistant">
            <img class="message-avatar" src="/avatar.jpg" alt="">
            <div class="message-body">
              <span class="speaker">VARJÃO</span>
              <p>Olá! Estou pronto. Como posso ajudar?</p>
            </div>
          </div>
        </div>

        <form id="chatForm" class="composer">
          <input
            id="prompt"
            type="text"
            autocomplete="off"
            placeholder="Fale comigo ou digite..."
            aria-label="Mensagem"
          >

          <button class="send-btn" type="submit" aria-label="Enviar">
            ➤
          </button>
        </form>

        <div class="controls">

          <button id="micBtn" class="mic-btn" type="button">
            <span class="mic-symbol">🎙</span>
            FALAR
          </button>

          <label for="imageInput" class="add-btn" aria-label="Adicionar foto">
            +
          </label>

          <input
            id="imageInput"
            type="file"
            accept="image/*"
            hidden
          >

          <button
            id="documentBtn"
            class="add-btn document-button"
            type="button"
            aria-label="Adicionar documento"
            title="Adicionar documento"
          >
            📄
          </button>

          <input
            id="documentInput"
            type="file"
            accept=".pdf,.docx,.txt,.xlsx"
            hidden
          >
        </div>

        <section id="documentPanel" class="document-panel">

          <button
            id="documentClose"
            class="document-close"
            type="button"
            aria-label="Fechar documentos"
          >
            ×
          </button>

          <div class="document-heading">
            DOCUMENTO DO VARJÃO
          </div>

          <div id="documentFilename" class="document-filename">
            Nenhum documento selecionado.
          </div>

          <label for="documentContent">Conteúdo do documento</label>
          <textarea
            id="documentContent"
            placeholder="O conteúdo extraído aparecerá aqui..."
          ></textarea>

          <label for="documentInstruction">O que deseja que o VARJÃO faça?</label>
          <textarea
            id="documentInstruction"
            placeholder="Ex.: Corrija os erros, melhore a escrita e preserve todas as informações."
          ></textarea>

          <div class="document-actions">
            <button id="documentEdit" type="button">
              ✨ APLICAR EDIÇÃO
            </button>

            <button id="documentExport" type="button">
              ↓ GERAR PDF
            </button>
          </div>

          <div
            id="documentStatus"
            class="document-status"
            aria-live="polite"
          ></div>
        </section>

        <p class="privacy-note">
          Sua chave de IA fica no servidor, nunca neste iPhone.
        </p>

      </section>

    </main>
  </div>

  <script src="/app.js"></script>
  <script src="/documents.js"></script>

</body>
</html>
